name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install locked dependencies
        run: corepack npm@11.12.1 ci
      - name: Run repository checks
        run: npm run check

  local-integration:
    name: Local integration checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install locked dependencies
        run: corepack npm@11.12.1 ci
      - name: Verify the deterministic local stack
        run: npm run test:local-integration
      - name: Stop the local stack
        if: always()
        run: npm run local:stop
